services:
  frontend:
    build: ./frontend
    ports:
      - "8083:80"
    volumes:
      - ./frontend:/usr/share/nginx/html
    depends_on:
      - routing
      - export
    networks:
      - route-planner-network

  routing:
    build: ./routing
    ports:
      - "8002:8002"
    environment:
      - VALHALLA_API_URL=${VALHALLA_API_URL:-https://valhalla1.openstreetmap.de/route}
      - VALHALLA_ONLINE_API_URL=${VALHALLA_ONLINE_API_URL:-https://valhalla1.openstreetmap.de/route}
      - VALHALLA_REMOTE_URL=${VALHALLA_REMOTE_URL:-https://valhalla1.openstreetmap.de/route}
      - VALHALLA_LOCAL_URL=${VALHALLA_LOCAL_URL:-http://valhalla:8002/route}
      - VALHALLA_ADMIN_URL=${VALHALLA_ADMIN_URL:-http://valhalla:8003}
      - VALHALLA_STATUS_URL=${VALHALLA_STATUS_URL:-http://valhalla:8002/status}
      - VALHALLA_TILE_DIR=${VALHALLA_TILE_DIR:-/data/valhalla_tiles}
      - VALHALLA_TILE_EXTRACT=${VALHALLA_TILE_EXTRACT:-/data/valhalla_tiles.tar}
      - USE_LOCAL_VALHALLA=${USE_LOCAL_VALHALLA:-false}
      - GRAPHHOPPER_API_URL=${GRAPHHOPPER_API_URL:-https://graphhopper.com/api/1/route}
      - GRAPHHOPPER_API_KEY=${GRAPHHOPPER_API_KEY:-}
      - SNAP_RADIUS_METERS=${SNAP_RADIUS_METERS:-18}
      - RELAXED_SNAP_RADIUS_METERS=${RELAXED_SNAP_RADIUS_METERS:-55}
      - MAX_HIKING_DIFFICULTY=${MAX_HIKING_DIFFICULTY:-6}
    volumes:
      - ./data:/data
    networks:
      - route-planner-network
    depends_on:
      - valhalla
    shm_size: '2gb'

  valhalla:
    image: ghcr.io/valhalla/valhalla:latest
    ports:
      - "8008:8002"
      - "8003:8003"
    command:
      - /bin/sh
      - -lc
      - >
        echo "Starting Valhalla admin server..." &&
        python3 /data/patch_config.py &&
        exec python3 /data/admin_server.py
    environment:
      - ADMIN_PORT=8003
      - VALHALLA_PORT=8002
    volumes:
      - ./data:/data
    networks:
      - route-planner-network
    shm_size: '2gb'

  export:
    build: ./export
    ports:
      - "3001:3000"
    volumes:
      - ./data:/data
      - /var/run/docker.sock:/var/run/docker.sock
    networks:
      - route-planner-network
    depends_on:
      - routing
      - valhalla

networks:
  route-planner-network:
    driver: bridge
